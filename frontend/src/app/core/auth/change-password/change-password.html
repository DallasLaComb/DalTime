<div class="min-h-screen flex items-center justify-center py-12 px-4 bg-dt-neutral-50">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <img src="daltime-logo.png" alt="DalTime" class="h-16 w-auto mx-auto" />
      <h2 class="mt-4 text-2xl font-bold text-gray-900">Set New Password</h2>
      <p class="mt-2 text-sm text-gray-500">
        Your administrator created your account with a temporary password. Please set a new password
        to continue.
      </p>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200">
      <div class="p-6">
        @if (error()) {
          <div
            class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-2 text-sm text-red-800"
            data-testid="change-password-error"
          >
            {{ error() }}
          </div>
        }

        <app-password-input
          inputId="newPassword"
          label="New Password"
          testId="new-password-input"
          placeholder="New password"
          autocomplete="new-password"
          [value]="newPassword()"
          [hasError]="submitted() && !newPassword().trim()"
          errorMessage="New password is required"
          errorTestId="new-password-error"
          (valueChange)="newPassword.set($event)"
        />

        <app-password-input
          inputId="confirmPassword"
          label="Confirm Password"
          testId="confirm-password-input"
          placeholder="Confirm password"
          autocomplete="new-password"
          [value]="confirmPassword()"
          [hasError]="passwordsMismatch"
          errorMessage="Passwords do not match"
          errorTestId="mismatch-error"
          (valueChange)="confirmPassword.set($event)"
        />

        <app-button
          variant="primary"
          size="lg"
          [fullWidth]="true"
          [loading]="submitting()"
          testId="set-password-btn"
          (clicked)="onSubmit()"
          >Set Password</app-button
        >
      </div>
    </div>
  </div>
</div>

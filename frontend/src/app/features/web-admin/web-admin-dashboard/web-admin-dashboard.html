<div class="w-full px-4 py-4 md:py-6">
  <h2 class="mb-6 text-2xl font-bold text-gray-900">Web Admin Dashboard</h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <!-- Organizations -->
    <a
      routerLink="/web-admin/organizations"
      class="group flex flex-col gap-2 rounded-xl border border-gray-200 bg-white p-5 shadow-sm hover:border-dt-primary/50 hover:shadow-md transition-all no-underline"
      data-testid="dashboard-card-organizations"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex h-10 w-10 items-center justify-center rounded-lg bg-dt-primary/10 text-dt-primary group-hover:bg-dt-primary/20 transition-colors"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21"
            />
          </svg>
        </div>
        <span class="font-semibold text-gray-900">Organizations</span>
      </div>
      <p class="text-sm text-gray-500">Create and manage organizations on the platform.</p>
    </a>

    <!-- Employees -->
    <a
      routerLink="/web-admin/employees"
      class="group flex flex-col gap-2 rounded-xl border border-gray-200 bg-white p-5 shadow-sm hover:border-dt-primary/50 hover:shadow-md transition-all no-underline"
      data-testid="dashboard-card-employees"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex h-10 w-10 items-center justify-center rounded-lg bg-dt-primary/10 text-dt-primary group-hover:bg-dt-primary/20 transition-colors"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"
            />
          </svg>
        </div>
        <span class="font-semibold text-gray-900">Employees</span>
      </div>
      <p class="text-sm text-gray-500">Look up employees across all organizations.</p>
    </a>

    <!-- Impersonate -->
    <a
      routerLink="/web-admin/impersonate"
      class="group flex flex-col gap-2 rounded-xl border border-gray-200 bg-white p-5 shadow-sm hover:border-dt-primary/50 hover:shadow-md transition-all no-underline"
      data-testid="dashboard-card-impersonate"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex h-10 w-10 items-center justify-center rounded-lg bg-amber-100 text-amber-600 group-hover:bg-amber-200 transition-colors"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"
            />
          </svg>
        </div>
        <span class="font-semibold text-gray-900">Impersonate User</span>
      </div>
      <p class="text-sm text-gray-500">View the app as any Org Admin, Manager, or Employee.</p>
    </a>

    <!-- Broadcasts -->
    <a
      routerLink="/web-admin/broadcasts"
      class="group flex flex-col gap-2 rounded-xl border border-gray-200 bg-white p-5 shadow-sm hover:border-dt-primary/50 hover:shadow-md transition-all no-underline"
      data-testid="dashboard-card-broadcasts"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex h-10 w-10 items-center justify-center rounded-lg bg-dt-primary/10 text-dt-primary group-hover:bg-dt-primary/20 transition-colors"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10.34 15.84c-.688-.06-1.386-.09-2.09-.09H7.5a4.5 4.5 0 110-9h.75c.704 0 1.402-.03 2.09-.09m0 9.18c.253.962.584 1.892.985 2.783.247.55.06 1.21-.463 1.511l-.657.38c-.551.318-1.26.117-1.527-.461a20.845 20.845 0 01-1.44-4.282m3.102.069a18.03 18.03 0 01-.59-4.59c0-1.586.205-3.124.59-4.59m0 9.18a23.848 23.848 0 018.835 2.535M10.34 6.66a23.847 23.847 0 008.835-2.535m0 0A23.74 23.74 0 0018.795 3m.38 1.125a23.91 23.91 0 011.014 5.395m-1.014 8.855c-.118.38-.245.754-.38 1.125m.38-1.125a23.91 23.91 0 001.014-5.395m0-3.46c.495.413.811 1.035.811 1.73 0 .695-.316 1.317-.811 1.73m0-3.46a24.347 24.347 0 010 3.46"
            />
          </svg>
        </div>
        <span class="font-semibold text-gray-900">Broadcasts</span>
      </div>
      <p class="text-sm text-gray-500">Show a banner to all users, an organization, or a role.</p>
    </a>
  </div>

  <!-- Developer Tools section — Web-Admin only; not visible to any other role -->
  <div class="mt-8">
    <h3 class="mb-4 text-lg font-semibold text-gray-700">Developer Tools</h3>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <app-generate-dummy-data />
    </div>
  </div>
</div>

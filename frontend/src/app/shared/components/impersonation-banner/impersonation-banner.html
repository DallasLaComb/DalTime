@if (viewingAs(); as ctx) {
  <div
    class="dt-debug bg-amber-500 text-white px-4 py-2 flex items-center justify-between gap-4"
    role="alert"
    data-testid="impersonation-banner"
  >
    <div class="flex items-center gap-2 min-w-0">
      <svg
        class="h-4 w-4 shrink-0"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
        />
      </svg>
      <span class="text-sm font-medium truncate">
        Viewing as <strong>{{ ctx.displayName }}</strong> ({{ ctx.role }})
      </span>
    </div>
    <app-button variant="ghost" size="sm" testId="impersonation-banner-exit" (clicked)="exit()">
      Exit
    </app-button>
  </div>
}

<div class="flex justify-between items-start mb-1">
  <h6 class="text-base font-semibold text-gray-900 mb-0" [attr.data-testid]="nameTestId()">
    {{ employee().first_name }} {{ employee().last_name }}
  </h6>
  <app-status-badge
    [status]="employee().status"
    [label]="statusLabel(employee().status)"
    [colorMap]="statusColorMap"
  />
</div>
<p class="text-sm text-gray-500 mb-1" [attr.data-testid]="emailTestId()">{{ employee().email }}</p>
@if (employee().phone) {
  <p class="text-sm text-gray-500 mb-1" [attr.data-testid]="phoneTestId()">
    <app-phone-display [phone]="employee().phone" />
  </p>
}
<div class="flex justify-between items-center mb-3">
  <small class="text-gray-400">{{ employee().created_at | date: 'mediumDate' }}</small>
</div>

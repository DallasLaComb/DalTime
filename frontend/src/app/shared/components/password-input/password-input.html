<div class="mb-4">
  <label [for]="inputId()" class="block text-sm font-medium text-gray-700 mb-1">{{
    label()
  }}</label>
  <div class="flex">
    <input
      [type]="showPassword() ? 'text' : 'password'"
      class="block flex-1 rounded-l-lg border border-r-0 border-gray-300 px-3 py-2.5 text-base shadow-sm focus:border-dt-secondary focus:outline-none focus:ring-1 focus:ring-dt-secondary"
      [class.input-error]="hasError()"
      [id]="inputId()"
      [attr.data-testid]="testId()"
      [value]="value()"
      (input)="onInput($event)"
      (keydown.enter)="enterPressed.emit()"
      [placeholder]="placeholder()"
      [autocomplete]="autocomplete()"
    />
    <button
      class="btn-dt-secondary rounded-l-none rounded-r-lg border border-dt-secondary px-3 text-sm"
      type="button"
      data-testid="toggle-password-btn"
      (click)="togglePassword()"
    >
      {{ showPassword() ? 'Hide' : 'Show' }}
    </button>
  </div>
  @if (hasError() && errorMessage()) {
    <p class="input-feedback" [attr.data-testid]="errorTestId()">{{ errorMessage() }}</p>
  }
</div>
